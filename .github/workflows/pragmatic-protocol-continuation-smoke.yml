name: Pragmatic protocol continuation smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/pragmatic-protocol-continuation-smoke.mjs"
      - ".github/workflows/pragmatic-protocol-continuation-smoke.yml"
      - "src/providers/pragmatic.js"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run protocol continuation smoke
        run: npm run pragmatic:protocol-smoke
      - name: Print result
        if: always()
        run: |
          if [ -f results/pragmatic-protocol-continuation-smoke.json ]; then
            node -e "const x=require('./results/pragmatic-protocol-continuation-smoke.json'); for(const r of x.results){console.log([r.name,'status='+r.status,'entry='+(r.entry?.action||'-')+'/na:'+(r.entry?.na||'-'),'first='+(r.firstContinuation?.kind||'-'),'choices='+(r.choices?.length||0),'second='+(r.secondContinuation?.kind||'-'),'next='+(r.next?.action||'-')+'/fs:'+(r.next?.fs||'-'),'err='+(r.error?String(r.error).split('\n')[0]:'-')].join(' | '))}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pragmatic-protocol-continuation-smoke
          path: results/pragmatic-protocol-continuation-smoke.json
          if-no-files-found: warn
          retention-days: 7
