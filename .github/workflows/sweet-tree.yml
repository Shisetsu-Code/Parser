name: Untested 4 Fairy Flowers tree

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sweet-tree.yml"
      - "src/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run 4 Fairy Flowers tree
        shell: bash
        run: |
          printf '%s\n' 'https://3oaks.com/game/4_fairy_flowers | tree_all' > target.txt
          node src/index.js --headless --targets target.txt --timeout 40000 --settle 1800 --action-wait 500 --tree-max-depth 4 --tree-max-states 10 --tree-max-edges 28 --tree-max-controls 8
      - name: Show traffic/tree
        if: always()
        shell: bash
        run: |
          grep -R -E 'tree state=|tree edge=|tree done|signals=|replayFailures|purchased_feature|doSpin|doBonus|purchase|bonus' results || true
