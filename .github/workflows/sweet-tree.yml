name: Untested Sugar Rush 1000 tree

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sweet-tree.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run Sugar Rush 1000 tree
        shell: bash
        run: |
          printf '%s\n' 'https://www.pragmaticplay.com/en/games/sugar-rush-1000/?gamelang=en&cur=USD | tree_all' > target.txt
          node src/index.js --headless --targets target.txt --timeout 40000 --settle 1800 --action-wait 500 --tree-max-depth 5 --tree-max-states 12 --tree-max-edges 32 --tree-max-controls 16 --tree-auto-wait 8000 --tree-quiet 900 --tree-repeat-limit 20

      - name: Show tree/continuations
        if: always()
        shell: bash
        run: |
          grep -R -E 'tree state=|tree edge=|tree done|continuations|waitedMs|transitions|signals=|replayFailures|pur=|purchased_feature|doSpin|doBonus|featurePurchaseIndex|pendingPurchaseIndex' results || true
