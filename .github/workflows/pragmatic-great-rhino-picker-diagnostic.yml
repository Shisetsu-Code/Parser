name: Pragmatic Great Rhino picker diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/pragmatic-great-rhino-picker-diagnostic.mjs"
      - ".github/workflows/pragmatic-great-rhino-picker-diagnostic.yml"
      - "src/providers/pragmatic.js"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install chromium
      - name: Run Great Rhino picker diagnostic
        run: npm run pragmatic:rhino-diagnostic
      - name: Print diagnostic detail
        if: always()
        run: |
          if [ -f results/pragmatic-great-rhino-picker-diagnostic.json ]; then
            node - <<'NODE'
            const x=require('./results/pragmatic-great-rhino-picker-diagnostic.json');
            for (const r of x.results) {
              console.log('BRANCH',r.branch,'status='+r.status,'clickDiff='+Object.keys(r.diffs?.click||{}).join(','));
              const classes=r.before?.globalClasses||[];
              for (const cls of classes) {
                if (!/BonusPickConnection|PickableFSOption/.test(cls.key)) continue;
                console.log('CLASS',cls.key,'count='+cls.count);
                for (const ex of cls.examples||[]) {
                  console.log(' EXAMPLE',ex.name,'active='+ex.active,'fields='+JSON.stringify(ex.fields||{}));
                  console.log(' METHODS',JSON.stringify(ex.methods||[]));
                  for (const m of ex.methodDetails||[]) {
                    console.log('  METHOD',m.name,'len='+m.length,'src='+String(m.source||'').replace(/\s+/g,' ').slice(0,1800));
                  }
                }
              }
              console.log('VARS',JSON.stringify(r.before?.varSnapshot||{}));
              console.log('ERROR',r.error?String(r.error).split('\n')[0]:'-');
            }
            NODE
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pragmatic-great-rhino-picker-diagnostic
          path: results/pragmatic-great-rhino-picker-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
