name: Pragmatic economic purchase audit

# Deprecated: retained only for manual historical/debug runs.
# The active Parser scope no longer varies base wager/price.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run economic purchase audit
        run: npm run pragmatic:economic-audit
      - name: Print compact summary
        if: always()
        run: |
          if [ -f results/pragmatic-economic-purchase-audit.json ]; then
            node -e "const x=require('./results/pragmatic-economic-purchase-audit.json'); for(const r of x.results){console.log([r.index,r.name,'total='+r.totalEconomicPurchases,Object.entries(r.bySubtype).map(([k,v])=>k+'='+v).join(','),'branches='+r.branches,'error='+(r.error||'-')].join(' | '))}; console.log('SUMMARY games='+x.totalGames+' errors='+x.errors)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pragmatic-economic-purchase-audit
          path: results/pragmatic-economic-purchase-audit.json
          if-no-files-found: warn
          retention-days: 7
