name: Pragmatic direct purchase spin test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/pragmatic-direct-purchase-spin-test.mjs"
      - ".github/workflows/pragmatic-direct-purchase-spin-test.yml"
      - "src/providers/pragmatic.js"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run downstream purchase spin test
        run: npm run pragmatic:direct-purchase-spin-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pragmatic-direct-purchase-spin-test
          path: results/pragmatic-direct-purchase-spin-test.json
          if-no-files-found: warn
          retention-days: 7
