name: Generic provider diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ten-untried-games.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "bgaming-burning-chilli-x"
            url: "https://bgaming.com/es/games/burning-chilli-x"
          - id: "belatra-slime-bonanza"
            url: "https://free-slot.belatragames.com/play/slime-bonanza"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run diagnostic tree
        shell: bash
        env:
          GAME_URL: ${{ matrix.url }}
        run: |
          printf '%s | tree_all\n' "$GAME_URL" > target.txt
          node src/index.js --headless --targets target.txt --timeout 20000 --settle 2500 --tree-max-depth 1 --tree-max-states 2 --tree-max-edges 2 --tree-max-controls 2
      - name: Print diagnostics
        if: always()
        shell: bash
        run: |
          cat results/summary.json 2>/dev/null || true
          grep -R 'runtimeDebug\|runtime-debug\|error' results 2>/dev/null || true
