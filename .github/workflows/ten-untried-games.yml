name: Generic launcher attribute diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ten-untried-games.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "bgaming-burning"
            url: "https://bgaming.com/es/games/burning-chilli-x"
          - id: "belatra-slime"
            url: "https://free-slot.belatragames.com/play/slime-bonanza"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Diagnose launcher
        shell: bash
        env:
          GAME_URL: ${{ matrix.url }}
        run: |
          printf '%s | tree_all\n' "$GAME_URL" > target.txt
          node src/index.js --headless --targets target.txt --timeout 12000 --settle 2200 --tree-max-depth 1 --tree-max-states 1 --tree-max-edges 1 --tree-max-controls 1
      - name: Print debug
        if: always()
        shell: bash
        run: |
          grep -R 'runtimeDebug' results/*.json 2>/dev/null || true
